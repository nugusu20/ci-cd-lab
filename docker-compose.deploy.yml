services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/nugusu20/ci-cd-lab}:${IMAGE_TAG:-local-compose}
    container_name: ci-cd-lab-app
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/staging.env}
    environment:
      DB_PATH: /data/tasks.db
    volumes:
      - ci_cd_lab_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ci-cd-lab-nginx
    ports:
      - "8080:80"
    volumes:
      - /home/avidan/devops-lab/ci-cd-lab/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ci_cd_lab_data:
