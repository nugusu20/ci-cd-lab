name: CI

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run application smoke check
        run: |
          python -m app.main & sleep 2
          curl -fsS http://127.0.0.1:8000/health
          pkill -f "python -m app.main" || true

      - name: Run lint
        run: |
          python -m flake8 app tests

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/

      - name: Write test summary
        run: |
          mkdir -p artifacts
          printf 'Python version: %s\nTests: passed\n' "${{ matrix.python-version }}" > artifacts/test-summary.txt

      - name: Upload test summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.python-version }}
          path: artifacts/test-summary.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "IMAGE_NAME=ci-cd-lab" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Run container health check
        run: |
          docker run -d --rm --name ci-cd-lab-ci -p 8000:8000 "${IMAGE_NAME}:${IMAGE_TAG}"
          sleep 3
          curl -fsS http://127.0.0.1:8000/health
          docker stop ci-cd-lab-ci
