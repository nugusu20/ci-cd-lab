name: CI

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.deploy.yml'
      - 'nginx/**'
      - 'Makefile'
      - 'README.md'
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.deploy.yml'
      - 'nginx/**'
      - 'Makefile'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run application smoke check
        run: |
          python -m app.main & sleep 2
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/version
          pkill -f "python -m app.main" || true

      - name: Run lint
        run: |
          python -m flake8 app tests

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/

      - name: Write test summary
        run: |
          mkdir -p artifacts
          printf 'Python version: %s\nTests: passed\n' "${{ matrix.python-version }}" > artifacts/test-summary.txt

      - name: Upload test summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.python-version }}
          path: artifacts/test-summary.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "IMAGE_NAME=ci-cd-lab" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=ghcr.io/${{ github.repository_owner }}/ci-cd-lab:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${REGISTRY_IMAGE}"

      - name: Write image metadata
        run: |
          mkdir -p artifacts
          printf 'local_image=%s:%s\n' "${IMAGE_NAME}" "${IMAGE_TAG}" > artifacts/image-info.txt
          printf 'registry_image=%s\n' "${REGISTRY_IMAGE}" >> artifacts/image-info.txt

      - name: Run container health check
        run: |
          docker run -d --rm --name ci-cd-lab-ci -p 8000:8000 \
            -e APP_VERSION="${IMAGE_TAG}" \
            -e IMAGE_TAG="${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          sleep 8
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/version
          docker inspect --format='{{.State.Health.Status}}' ci-cd-lab-ci | grep healthy
          docker stop ci-cd-lab-ci

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-info
          path: artifacts/image-info.txt

  compose-proxy-check:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker Compose stack
        run: |
          APP_VERSION=gha-compose IMAGE_TAG=gha-compose docker compose up -d --build

      - name: Verify proxy endpoints
        run: |
          sleep 8
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ready
          curl -fsS http://127.0.0.1:8080/version

      - name: Verify proxy container health
        run: |
          docker inspect --format='{{.State.Health.Status}}' ci-cd-lab-app | grep healthy

      - name: Tear down Docker Compose stack
        if: always()
        run: |
          docker compose down -v
